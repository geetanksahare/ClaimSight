[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claimsight"
version = "0.1.0"
description = "Health insurance cost and claims intelligence platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ClaimSight Contributors"}
]
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.26.0,<3.0.0",
    "pyarrow>=14.0.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0,<3.0.0",
    "lightgbm>=4.0.0",
    "optuna>=3.5.0",
    "shap>=0.44.0",
    "fairlearn>=0.10.0",
    "mlflow>=2.10.0",
    "pandera>=0.18.0",
    "joblib>=1.3.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
    "typer>=0.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "streamlit>=1.32.0",
    "plotly>=5.19.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "pre-commit>=3.6.0",
]
kaggle = [
    "kaggle>=1.6.0",
]

[project.scripts]
claimsight = "claimsight.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --cov=src/claimsight --cov-report=term-missing"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["src/claimsight"]
omit = [
    "src/claimsight/app/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
