version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "claimsight.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - CLAIMSIGHT_ENV=production
      - MLFLOW_ALLOW_FILE_STORE=true
    volumes:
      - ./models:/app/models:ro
      - ./reports:/app/reports:ro
      - ./data/demo:/app/data/demo:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["streamlit", "run", "src/claimsight/app/Home.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - CLAIMSIGHT_ENV=production
      - MLFLOW_ALLOW_FILE_STORE=true
    volumes:
      - ./models:/app/models:ro
      - ./reports:/app/reports:ro
      - ./data/demo:/app/data/demo:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
